<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de QR Code Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #07090e;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top Bar Header */
    .header-card {
      background-color: #111726;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(6, 182, 212, 0.3);
    }

    .brand-icon svg {
      width: 18px;
      height: 18px;
      stroke: #ffffff;
      fill: none;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.35);
      color: #38bdf8;
      text-transform: uppercase;
    }

    .status-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      background-color: #0b0f19;
      border: 1px solid #1e293b;
      color: #34d399;
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10b981;
    }

    /* Card Principal */
    .main-card {
      background-color: #111726;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .char-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #64748b;
    }

    textarea {
      width: 100%;
      height: 72px;
      background-color: #0b0f19;
      border: 1px solid #1e293b;
      border-radius: 8px;
      color: #f1f5f9;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 8px 10px;
      outline: none;
      resize: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: #06b6d4;
      box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2);
    }

    /* Container e Visualização do QR Code */
    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
    }

    #qrcode {
      width: 220px;
      height: 220px;
      background-color: #ffffff;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    #qrcode:hover {
      transform: scale(1.02);
    }

    #qrcode svg {
      width: 100% !important;
      height: 100% !important;
      max-width: 200px !important;
      max-height: 200px !important;
      display: block;
    }

    .qr-placeholder {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      user-select: none;
    }

    .qr-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #64748b;
      margin-top: 6px;
      text-align: center;
    }

    /* Botões */
    .actions-row {
      display: flex;
      gap: 8px;
    }

    .btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      flex: 1;
      border: 1px solid transparent;
    }

    .btn-secondary {
      background-color: #1e293b;
      border-color: #334155;
      color: #cbd5e1;
    }

    .btn-secondary:hover {
      background-color: #334155;
      color: #ffffff;
    }

    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
    }

    .btn-primary:hover {
      background-color: #0369a1;
    }

    .btn-clean {
      background-color: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-clean:hover {
      background-color: #334155;
      color: #ffffff;
    }

    /* Painel de Opções */
    #settings {
      display: none;
      background-color: #0b0f19;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      gap: 8px;
      grid-template-columns: 1fr 1fr;
    }

    .setting-item label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 4px;
    }

    .setting-item select,
    .setting-item input {
      width: 100%;
      background-color: #07090e;
      border: 1px solid #1e293b;
      border-radius: 6px;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 4px 6px;
      outline: none;
    }

    .error-box {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #f87171;
      display: none;
      text-align: center;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #1e293b;
      padding-top: 8px;
      font-size: 10px;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body onload="initApp()">

  <div class="wrapper">
    
    <!-- Top Bar -->
    <header class="header-card">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
          </svg>
        </div>
        <div class="brand-title">
          QR Forge <span class="badge-tag">SVG</span>
        </div>
      </div>

      <div style="display: flex; gap: 8px; align-items: center;">
        <div class="status-badge">
          <span class="dot"></span> 100% Offline
        </div>
        <button class="btn-clean" onclick="clearAll()">Limpar</button>
      </div>
    </header>

    <!-- Main Card -->
    <main class="main-card">
      
      <!-- Campo de Entrada -->
      <div>
        <div class="input-header">
          <span class="input-label">Texto / Endereço</span>
          <span id="charCount" class="char-count">0 caracteres</span>
        </div>
        <textarea id="input" placeholder="Cole o texto, hiperligação ou carteira Bitcoin aqui..."></textarea>
        <div id="input-error" class="error-box"></div>
      </div>

      <!-- Visor Centralizado do QR Code -->
      <div class="qr-container">
        <div id="qrcode" onclick="downloadSvg()" title="Clique para descarregar o ficheiro SVG">
          <div class="qr-placeholder">Aguardando introdução de texto...</div>
        </div>
        <span class="qr-hint">Clique no código para descarregar o SVG</span>
      </div>

      <!-- Barra de Ações -->
      <div class="actions-row">
        <button class="btn btn-secondary" onclick="toggleSettings()">
          ⚙️ <span id="settingsToggleText">Opções</span>
        </button>
        <button class="btn btn-primary" onclick="downloadSvg()">
          ⬇️ <span>Descarregar SVG</span>
        </button>
      </div>

      <!-- Painel Opcional de Ajustes -->
      <div id="settings">
        <div class="setting-item">
          <label>Correção (ECC)</label>
          <select id="setting-ecc" onchange="updateEccSetting()">
            <option value="L">Baixo (7%)</option>
            <option value="M">Médio (15%)</option>
            <option value="Q">Quartil (25%)</option>
            <option value="H" selected>Alto (30%)</option>
          </select>
        </div>
        <div class="setting-item">
          <label>Margem (Quiet Zone)</label>
          <input type="number" id="setting-border-size" value="1" min="0" max="6" oninput="updateBorderSetting()">
        </div>
      </div>

      <!-- Rodapé -->
      <div class="footer">
        <span>Motor Nayuki Client-Side</span>
        <span>Vetor SVG de Alta Fidelidade</span>
      </div>

    </main>
  </div>

  <script>
    let ERROR_CORRECTION_LEVEL = "H";
    let QR_BORDER_SIZE = 1;
    let QR_BLACK = "#07090e";
    let QR_WHITE = "#ffffff";

    const inputArea = document.getElementById("input");
    const qrcodeDiv = document.getElementById("qrcode");
    const settingsDiv = document.getElementById("settings");
    const inputError = document.getElementById("input-error");
    const charCount = document.getElementById("charCount");

    const updateQRCode = () => {
      const text = inputArea.value.trim();
      charCount.textContent = `${text.length} caracteres`;

      if (!text) {
        qrcodeDiv.innerHTML = '<div class="qr-placeholder">Aguardando introdução de texto...</div>';
        inputError.style.display = "none";
        window.currentSvg = null;
        return;
      }

      try {
        const ecc = qrcodegen.QrCode.Ecc[({L:"LOW", M:"MEDIUM", Q:"QUARTILE", H:"HIGH"}[ERROR_CORRECTION_LEVEL])];
        const qr = qrcodegen.QrCode.encodeText(text, ecc);
        const svg = toSvgString(qr, QR_BORDER_SIZE, QR_WHITE, QR_BLACK);
        
        window.currentQrCode = qr;
        window.currentSvg = svg;
        qrcodeDiv.innerHTML = svg;
        inputError.style.display = "none";
      } catch (e) {
        inputError.textContent = "Erro: Texto demasiado longo para este nível de correção.";
        inputError.style.display = "block";
      }
    };

    function toggleSettings() {
      const isVisible = settingsDiv.style.display === "grid";
      settingsDiv.style.display = isVisible ? "none" : "grid";
      document.getElementById("settingsToggleText").textContent = isVisible ? "Opções" : "Fechar";
    }

    function updateEccSetting() {
      ERROR_CORRECTION_LEVEL = document.getElementById("setting-ecc").value;
      updateQRCode();
    }

    function updateBorderSetting() {
      const val = parseInt(document.getElementById("setting-border-size").value, 10);
      QR_BORDER_SIZE = isNaN(val) ? 1 : Math.max(0, val);
      updateQRCode();
    }

    function downloadSvg() {
      if (!window.currentSvg) return;
      const blob = new Blob([window.currentSvg], {type: "image/svg+xml"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `qrcode_${Date.now()}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearAll() {
      inputArea.value = "";
      updateQRCode();
      inputArea.focus();
    }

    function initApp() {
      inputArea.focus();
    }

    inputArea.addEventListener("input", updateQRCode);

    function toSvgString(qr, border, lightColor, darkColor) {
      let parts = [];
      for (let y = 0; y < qr.size; y++) {
        for (let x = 0; x < qr.size; x++) {
          if (qr.getModule(x, y)) parts.push(`M${x + border},${y + border}h1v1h-1z`);
        }
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 ${qr.size + border * 2} ${qr.size + border * 2}" stroke="none"><rect width="100%" height="100%" fill="${lightColor}"/><path d="${parts.join(" ")}" fill="${darkColor}"/></svg>`;
    }
