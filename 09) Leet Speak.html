<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L337 5p34k C0nv3r73r - Multi-Nível</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            darkbg: '#07090e',
            darkcard: '#111726',
            darkborder: '#1e293b',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #07090e;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0d121f;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body onload="initApp()" class="min-h-screen flex flex-col p-3 md:p-5 antialiased selection:bg-emerald-500 selection:text-black">

  <div class="max-w-4xl mx-auto w-full flex-grow flex flex-col gap-3">
    
    <!-- Top Bar: Header -->
    <header class="bg-darkcard border border-darkborder rounded-xl p-3 md:p-4 shadow-lg relative overflow-hidden backdrop-blur-md">
      <div class="absolute -right-16 -top-16 w-52 h-52 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="h-8 w-8 rounded-lg bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center shadow-md shadow-emerald-500/20">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
            </svg>
          </div>
          <div>
            <h1 class="text-base md:text-lg font-bold tracking-tight text-white flex items-center gap-2">
              Leet Converter <span id="headerLevelTag" class="text-emerald-400 font-mono text-[10px] px-1.5 py-0.5 rounded bg-emerald-950/70 border border-emerald-800/50 uppercase">Médio</span>
            </h1>
            <p class="text-[11px] text-slate-400">Conversão de texto em 3 dialetos: Básico, Médio e ASCII Hardcore</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <span class="px-2 py-1 rounded-lg bg-slate-900 border border-darkborder text-[11px] font-mono text-emerald-400 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> 100% Offline
          </span>
          <button onclick="clearAll()" title="Limpar todos os campos" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition active:scale-95 flex items-center gap-1">
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            Limpar
          </button>
        </div>
      </div>
    </header>

    <!-- Workspace Principal -->
    <main class="flex flex-col gap-2.5">

      <!-- Seletor de Níveis -->
      <div class="bg-darkcard border border-darkborder rounded-xl p-2.5 shadow-sm flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
        <div class="flex items-center gap-1.5">
          <span class="text-[11px] font-mono uppercase tracking-wider text-slate-400">Complexidade:</span>
          <span id="levelDescription" class="text-[11px] text-slate-500 font-mono hidden md:inline">Números e símbolos balanceados</span>
        </div>

        <div class="inline-flex rounded-lg bg-slate-900/90 p-1 border border-slate-800 gap-1" id="levelTabs">
          <button 
            type="button" 
            onclick="setLevel('basic')" 
            id="btn-basic" 
            class="px-2.5 py-1 rounded-md text-xs font-mono transition-all text-slate-400 hover:text-slate-200"
          >
            Básico
          </button>
          <button 
            type="button" 
            onclick="setLevel('medium')" 
            id="btn-medium" 
            class="px-2.5 py-1 rounded-md text-xs font-mono transition-all bg-emerald-600 text-white font-semibold shadow-sm"
          >
            Médio
          </button>
          <button 
            type="button" 
            onclick="setLevel('advanced')" 
            id="btn-advanced" 
            class="px-2.5 py-1 rounded-md text-xs font-mono transition-all text-slate-400 hover:text-slate-200"
          >
            Avançado (Hardcore)
          </button>
        </div>
      </div>

      <!-- Campo 1: Texto Normal (Entrada) -->
      <div class="bg-darkcard border border-darkborder focus-within:border-emerald-500/80 rounded-xl p-3 shadow-md transition">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-emerald-400">01</span>
            <label for="normalText" class="text-xs font-semibold text-slate-200">Texto Original</label>
          </div>
          <span id="charCount" class="text-[11px] font-mono text-slate-500">0 caracteres</span>
        </div>
        <input 
          type="text" 
          id="normalText" 
          placeholder="Digite ou cole seu texto aqui..."
          class="w-full bg-slate-900/90 border border-darkborder focus:border-emerald-500 text-slate-100 font-mono text-xs rounded-lg px-3 py-2 focus:outline-none transition shadow-inner placeholder:text-slate-600"
        />
      </div>

      <!-- Campo 2: Texto em Leet Speak (Saída) -->
      <div class="bg-darkcard border border-darkborder rounded-xl p-3 shadow-md transition hover:border-slate-700">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-cyan-400">02</span>
            <label for="leetText" class="text-xs font-semibold text-slate-200">Texto Convertido</label>
            <span id="resultBadge" class="px-1.5 py-0.2 rounded text-[10px] font-mono bg-emerald-950/80 text-emerald-300 border border-emerald-800/70">Leet Médio</span>
          </div>
          <button id="copyBtn" onclick="copyResult()" class="px-2.5 py-0.5 rounded bg-slate-800 hover:bg-emerald-950/60 hover:text-emerald-300 text-slate-300 text-xs font-mono border border-slate-700 flex items-center gap-1 transition active:scale-95">
            <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span id="copyBtnText">Copiar</span>
          </button>
        </div>
        <input 
          type="text" 
          id="leetText" 
          readonly 
          placeholder="O resultado convertido aparecerá aqui..."
          class="w-full bg-slate-950/80 border border-slate-800 text-emerald-400 font-mono text-xs rounded-lg px-3 py-2 focus:outline-none transition tracking-tight select-all cursor-copy"
        />
      </div>

    </main>

    <!-- Rodapé -->
    <footer class="text-center text-[11px] text-slate-500 py-2 flex flex-col sm:flex-row items-center justify-between gap-1 border-t border-slate-900 mt-1">
      <div class="flex items-center gap-2">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span id="footerInfo">Modo: Leet Médio</span>
      </div>
      <div>
        Navegação por <kbd class="px-1 py-0.2 bg-slate-800 border border-slate-700 rounded text-emerald-400 font-mono text-[9px]">Tab</kbd> ativa
      </div>
    </footer>
  </div>

  <script>
    // 1. Mapeamento Básico (Apenas dígitos simples)
    const leetBasic = {
      'a': '4', 'b': '8', 'e': '3', 'g': '6', 'i': '1',
      'l': '1', 'o': '0', 's': '5', 't': '7', 'z': '2'
    };

    // 2. Mapeamento Médio (Original do seu script)
    const leetMedium = {
      'a': '4', 'b': '8', 'c': '(', 'd': 'd', 'e': '3',
      'f': 'f', 'g': '6', 'h': '#', 'i': '1', 'j': 'j',
      'k': 'k', 'l': '1', 'm': 'm', 'n': 'n', 'o': '0',
      'p': 'p', 'q': 'q', 'r': 'r', 's': '5', 't': '7',
      'u': 'u', 'v': '\\/', 'w': '\\/\\/', 'x': 'x', 'y': 'y',
      'z': '2'
    };

    // 3. Mapeamento Avançado (ASCII Art / Hardcore clássico)
    const leetAdvanced = {
      'a': '/-\\', 'b': '|3', 'c': '<', 'd': '|)', 'e': '3',
      'f': '|=', 'g': '9', 'h': '|-|', 'i': '!', 'j': '_|',
      'k': '|<', 'l': '|_', 'm': '|V|', 'n': '|/|', 'o': '()',
      'p': '|D', 'q': '(,)', 'r': '|2', 's': '$', 't': '7',
      'u': '|_|', 'v': '\\/', 'w': '\\/\\/', 'x': '><', 'y': '`/',
      'z': '7_'
    };

    let currentLevel = 'medium';

    const levelDescriptions = {
      basic: 'Substituição simples e direta apenas por números',
      medium: 'Números e símbolos balanceados',
      advanced: 'ASCII Art hardcore com múltiplos caracteres'
    };

    function toLeetSpeak(text, level) {
      let map = leetMedium;
      if (level === 'basic') map = leetBasic;
      if (level === 'advanced') map = leetAdvanced;

      return text.split('').map(char => {
        const lowerChar = char.toLowerCase();
        return map[lowerChar] !== undefined ? map[lowerChar] : char;
      }).join('');
    }

    const normalText = document.getElementById('normalText');
    const leetText = document.getElementById('leetText');
    const charCount = document.getElementById('charCount');

    function updateConversion() {
      leetText.value = toLeetSpeak(normalText.value, currentLevel);
      charCount.textContent = `${normalText.value.length} caracteres`;
    }

    function setLevel(level) {
      currentLevel = level;

      // Estilização das abas
      ['basic', 'medium', 'advanced'].forEach(lvl => {
        const btn = document.getElementById(`btn-${lvl}`);
        if (lvl === level) {
          btn.className = "px-2.5 py-1 rounded-md text-xs font-mono transition-all bg-emerald-600 text-white font-semibold shadow-sm";
        } else {
          btn.className = "px-2.5 py-1 rounded-md text-xs font-mono transition-all text-slate-400 hover:text-slate-200";
        }
      });

      // Rótulos de cabeçalho e badges
      const labelMap = { basic: 'Básico', medium: 'Médio', advanced: 'Avançado' };
      document.getElementById('headerLevelTag').textContent = labelMap[level];
      document.getElementById('resultBadge').textContent = `Leet ${labelMap[level]}`;
      document.getElementById('levelDescription').textContent = levelDescriptions[level];
      document.getElementById('footerInfo').textContent = `Modo: Leet ${labelMap[level]}`;

      updateConversion();
      normalText.focus();
    }

    normalText.addEventListener('input', updateConversion);

    leetText.addEventListener('focus', () => {
      leetText.select();
    });

    leetText.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' && !e.shiftKey) {
        e.preventDefault();
        normalText.focus();
        normalText.select();
      }
    });

    async function copyResult() {
      const text = leetText.value;
      if (!text) return;

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          leetText.select();
          document.execCommand('copy');
        }

        const copyBtnText = document.getElementById('copyBtnText');
        const copyBtn = document.getElementById('copyBtn');
        const originalText = copyBtnText.textContent;

        copyBtnText.textContent = 'Copiado!';
        copyBtn.classList.add('border-emerald-700', 'bg-emerald-950/40', 'text-emerald-300');

        setTimeout(() => {
          copyBtnText.textContent = originalText;
          copyBtn.classList.remove('border-emerald-700', 'bg-emerald-950/40', 'text-emerald-300');
        }, 1200);

        leetText.classList.add('ring-1', 'ring-emerald-500/50');
        setTimeout(() => leetText.classList.remove('ring-1', 'ring-emerald-500/50'), 300);

      } catch (err) {
        console.error('Erro ao copiar:', err);
      }
    }

    function clearAll() {
      normalText.value = '';
      leetText.value = '';
      charCount.textContent = '0 caracteres';
      normalText.focus();
    }

    function initApp() {
      normalText.focus();
    }
  </script>
</body>
</html>
