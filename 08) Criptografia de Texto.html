<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AES-256-GCM Terminal - Criptografia Offline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            darkbg: '#07090e',
            darkcard: '#111726',
            darkborder: '#1e293b',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #07090e;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0d121f;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body onload="initApp()" class="min-h-screen flex flex-col p-3 md:p-5 antialiased selection:bg-cyan-500 selection:text-white">

  <div class="max-w-4xl mx-auto w-full flex-grow flex flex-col gap-3">
    
    <!-- Top Bar: Header & Status -->
    <header class="bg-darkcard border border-darkborder rounded-xl p-3 md:p-4 shadow-lg relative overflow-hidden backdrop-blur-md">
      <div class="absolute -right-16 -top-16 w-52 h-52 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <!-- Título -->
        <div class="flex items-center gap-3">
          <div class="h-8 w-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-md shadow-cyan-500/20">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <div>
            <h1 class="text-base md:text-lg font-bold tracking-tight text-white flex items-center gap-2">
              AES-256-GCM <span class="text-cyan-400 font-mono text-[10px] px-1.5 py-0.5 rounded bg-cyan-950/70 border border-cyan-800/50 uppercase">WebCrypto API</span>
            </h1>
            <p class="text-[11px] text-slate-400">Criptografia autenticada local (PBKDF2 100k iterações + IV de 96 bits)</p>
          </div>
        </div>

        <!-- Badges & Ações Rápidas -->
        <div class="flex items-center gap-2">
          <span class="px-2 py-1 rounded-lg bg-slate-900 border border-darkborder text-[11px] font-mono text-emerald-400 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> 100% Offline
          </span>
          <button onclick="clearAll()" title="Limpar todos os campos" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition active:scale-95 flex items-center gap-1">
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            Limpar
          </button>
        </div>
      </div>
    </header>

    <!-- Alerta Flutuante / Status -->
    <div id="alertBox" class="hidden px-3 py-2 rounded-xl text-xs font-mono transition-all border flex items-center justify-between">
      <span id="alertMsg"></span>
      <button onclick="hideAlert()" class="text-slate-400 hover:text-slate-200 ml-2">✕</button>
    </div>

    <!-- Workspace Principal -->
    <main class="flex flex-col gap-2.5">

      <!-- Campo de Chave (1 Linha) -->
      <div class="bg-darkcard border border-darkborder focus-within:border-cyan-500/80 rounded-xl p-3 shadow-md transition">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-cyan-400">01</span>
            <label for="key" class="text-xs font-semibold text-slate-200">Chave de Criptografia / Senha</label>
            <span class="px-1.5 py-0.2 rounded text-[10px] font-mono bg-slate-800 text-slate-400 border border-slate-700">Mín. 8 dígitos</span>
          </div>
          <span id="keyStrength" class="text-[11px] font-mono text-slate-500">0 caracteres</span>
        </div>

        <div class="relative flex items-center">
          <input 
            type="password" 
            id="key" 
            placeholder="Digite sua senha ou chave secreta..." 
            onkeydown="handleTab(event, 'message')"
            oninput="checkKeyLength()"
            class="w-full bg-slate-900/90 border border-darkborder focus:border-cyan-500 text-slate-100 font-mono text-xs rounded-lg px-3 py-2 pr-10 focus:outline-none transition shadow-inner placeholder:text-slate-600"
          />
          <button 
            type="button" 
            id="toggleKeyBtn" 
            onclick="toggleKeyVisibility()" 
            title="Alternar visibilidade da chave"
            class="absolute right-2 text-slate-400 hover:text-cyan-400 p-1 transition"
          >
            <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Campo de Texto de Origem -->
      <div class="bg-darkcard border border-darkborder focus-within:border-cyan-500/80 rounded-xl p-3 shadow-md transition">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-cyan-400">02</span>
            <label for="message" class="text-xs font-semibold text-slate-200">Texto / Mensagem / Payload</label>
          </div>
          <div class="flex items-center gap-2">
            <span id="msgCount" class="text-[11px] font-mono text-slate-500">0 caracteres</span>
            <button onclick="clearMessageOnly()" class="text-[10px] font-mono text-slate-400 hover:text-rose-400 transition">Limpar texto</button>
          </div>
        </div>
        <textarea 
          id="message" 
          rows="3" 
          placeholder="Digite o texto claro para criptografar OU cole o Base64 criptografado para descriptografar..."
          onkeydown="handleTab(event, 'result')"
          oninput="document.getElementById('msgCount').textContent = `${this.value.length} caracteres`"
          class="w-full bg-slate-900/90 border border-darkborder focus:border-cyan-500 text-slate-100 font-mono text-xs rounded-lg p-2.5 focus:outline-none transition shadow-inner placeholder:text-slate-600 resize-y"
        ></textarea>

        <!-- Barra de Ações Rápidas -->
        <div class="grid grid-cols-2 gap-2 mt-2">
          <button 
            id="encryptBtn" 
            onclick="encrypt()" 
            class="px-3 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold flex items-center justify-center gap-1.5 shadow-lg shadow-cyan-600/20 transition active:scale-95"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            Criptografar
          </button>
          
          <button 
            id="decryptBtn" 
            onclick="decrypt()" 
            class="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold flex items-center justify-center gap-1.5 shadow-lg shadow-emerald-600/20 transition active:scale-95"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/></svg>
            Descriptografar
          </button>
        </div>
      </div>

      <!-- Campo de Resultado -->
      <div class="bg-darkcard border border-darkborder rounded-xl p-3 shadow-md transition hover:border-slate-700">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-amber-400">03</span>
            <label for="result" class="text-xs font-semibold text-slate-200">Resultado</label>
          </div>
          <button id="copyBtn" onclick="copyResult()" class="px-2.5 py-0.5 rounded bg-slate-800 hover:bg-cyan-950/60 hover:text-cyan-300 text-slate-300 text-xs font-mono border border-slate-700 flex items-center gap-1 transition active:scale-95">
            <svg class="w-3 h-3 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span id="copyBtnText">Copiar Resultado</span>
          </button>
        </div>
        <textarea 
          id="result" 
          rows="3" 
          readonly 
          onkeydown="handleTab(event, 'key')"
          placeholder="O resultado criptografado (Base64) ou descriptografado será exibido aqui..."
          class="w-full bg-slate-950/80 border border-slate-800 text-cyan-300 font-mono text-xs rounded-lg p-2.5 focus:outline-none transition resize-y"
        ></textarea>
      </div>

    </main>

    <!-- Rodapé -->
    <footer class="text-center text-[11px] text-slate-500 py-2 flex flex-col sm:flex-row items-center justify-between gap-1 border-t border-slate-900 mt-1">
      <div class="flex items-center gap-2">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-cyan-500"></span>
        <span>Processamento Web Cryptography nativo</span>
      </div>
      <div>
        Navegação por <kbd class="px-1 py-0.2 bg-slate-800 border border-slate-700 rounded text-cyan-400 font-mono text-[9px]">Tab</kbd> ativa
      </div>
    </footer>
  </div>

  <script>
    let alertTimeout = null;

    function showAlert(msg, type = 'info') {
      const alertBox = document.getElementById('alertBox');
      const alertMsg = document.getElementById('alertMsg');
      
      alertMsg.textContent = msg;
      alertBox.className = 'px-3 py-2 rounded-xl text-xs font-mono transition-all border flex items-center justify-between ';
      
      if (type === 'danger') {
        alertBox.className += 'bg-rose-950/70 text-rose-300 border-rose-800/80';
      } else if (type === 'success') {
        alertBox.className += 'bg-emerald-950/70 text-emerald-300 border-emerald-800/80';
      } else {
        alertBox.className += 'bg-cyan-950/70 text-cyan-300 border-cyan-800/80';
      }
      
      alertBox.classList.remove('hidden');

      if (alertTimeout) clearTimeout(alertTimeout);
      alertTimeout = setTimeout(hideAlert, 5000);
    }

    function hideAlert() {
      document.getElementById('alertBox').classList.add('hidden');
    }

    function checkKeyLength() {
      const len = document.getElementById('key').value.length;
      const el = document.getElementById('keyStrength');
      el.textContent = `${len} caracteres`;
      if (len >= 8) {
        el.className = 'text-[11px] font-mono text-emerald-400 font-medium';
      } else {
        el.className = 'text-[11px] font-mono text-slate-500';
      }
    }

    function toggleKeyVisibility() {
      const keyInput = document.getElementById('key');
      const eyeIcon = document.getElementById('eyeIcon');
      
      if (keyInput.type === 'password') {
        keyInput.type = 'text';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
        `;
      } else {
        keyInput.type = 'password';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        `;
      }
    }

    // Derivação PBKDF2 com Salt baseado em SHA-256
    async function deriveKey(password) {
      const encoder = new TextEncoder();
      const passwordData = encoder.encode(password);
      const salt = await crypto.subtle.digest('SHA-256', passwordData);
      
      const importedKey = await crypto.subtle.importKey(
        'raw',
        passwordData,
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );
      
      return await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt,
          iterations: 100000,
          hash: 'SHA-256'
        },
        importedKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encrypt() {
      const message = document.getElementById('message').value;
      const password = document.getElementById('key').value;
      const resultOutput = document.getElementById('result');

      if (!message) {
        showAlert('Digite um texto para criptografar.', 'danger');
        return;
      }
      
      if (password.length < 8) {
        showAlert('A chave de criptografia deve possuir ao menos 8 caracteres.', 'danger');
        return;
      }

      try {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveKey(password);
        const encodedMessage = new TextEncoder().encode(message);

        const encryptedData = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv },
          key,
          encodedMessage
        );

        const result = new Uint8Array(iv.length + encryptedData.byteLength);
        result.set(iv);
        result.set(new Uint8Array(encryptedData), iv.length);

        const base64Result = btoa(String.fromCharCode(...result));
        resultOutput.value = base64Result;
        showAlert('Texto criptografado com sucesso!', 'success');
      } catch (err) {
        console.error('Erro na criptografia:', err);
        showAlert('Erro ao criptografar o conteúdo.', 'danger');
      }
    }

    async function decrypt() {
      const encryptedBase64 = document.getElementById('message').value.trim();
      const password = document.getElementById('key').value;
      const resultOutput = document.getElementById('result');

      if (!encryptedBase64) {
        showAlert('Cole o texto criptografado no campo de mensagem.', 'danger');
        return;
      }
      
      if (password.length < 8) {
        showAlert('A chave de criptografia deve possuir ao menos 8 caracteres.', 'danger');
        return;
      }

      let encryptedData;
      try {
        const binaryString = atob(encryptedBase64);
        encryptedData = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          encryptedData[i] = binaryString.charCodeAt(i);
        }
      } catch (e) {
        showAlert('Formato inválido. O texto fornecido não é um Base64 AES válido.', 'danger');
        return;
      }

      try {
        const iv = encryptedData.slice(0, 12);
        const ciphertext = encryptedData.slice(12);
        const key = await deriveKey(password);

        const decryptedData = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv },
          key,
          ciphertext
        );

        const decryptedText = new TextDecoder().decode(decryptedData);
        resultOutput.value = decryptedText;
        showAlert('Texto descriptografado com sucesso!', 'success');
      } catch (err) {
        console.error('Erro na descriptografia:', err);
        showAlert('Falha na autenticação GCM. Chave incorreta ou dados corrompidos.', 'danger');
      }
    }

    async function copyResult() {
      const resultText = document.getElementById('result').value;
      const copyBtnText = document.getElementById('copyBtnText');
      const copyBtn = document.getElementById('copyBtn');

      if (!resultText) {
        showAlert('Não há dados no resultado para copiar.', 'danger');
        return;
      }

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(resultText);
        } else {
          const res = document.getElementById('result');
          res.select();
          document.execCommand('copy');
        }

        const originalText = copyBtnText.textContent;
        copyBtnText.textContent = 'Copiado!';
        copyBtn.classList.add('border-emerald-700', 'bg-emerald-950/40', 'text-emerald-300');

        setTimeout(() => {
          copyBtnText.textContent = originalText;
          copyBtn.classList.remove('border-emerald-700', 'bg-emerald-950/40', 'text-emerald-300');
        }, 1200);

        showAlert('Resultado copiado para a área de transferência!', 'success');
      } catch (err) {
        console.error('Erro ao copiar:', err);
        showAlert('Erro ao copiar para a área de transferência.', 'danger');
      }
    }

    function handleTab(event, nextElementId) {
      if (event.key === "Tab") {
        event.preventDefault();
        const nextElement = document.getElementById(nextElementId);
        if (nextElement) {
          nextElement.focus();
        }
      }
    }

    function clearMessageOnly() {
      document.getElementById('message').value = '';
      document.getElementById('msgCount').textContent = '0 caracteres';
      document.getElementById('message').focus();
    }

    function clearAll() {
      document.getElementById('key').value = '';
      document.getElementById('message').value = '';
      document.getElementById('result').value = '';
      document.getElementById('keyStrength').textContent = '0 caracteres';
      document.getElementById('keyStrength').className = 'text-[11px] font-mono text-slate-500';
      document.getElementById('msgCount').textContent = '0 caracteres';
      hideAlert();
      document.getElementById('key').focus();
    }

    function initApp() {
      document.getElementById('key').focus();
    }
  </script>
</body>
</html>
