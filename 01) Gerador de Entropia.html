          </div>
          <button class="copy-btn px-2.5 py-0.5 rounded bg-slate-800 hover:bg-cyan-950/60 hover:text-cyan-300 text-slate-300 text-xs font-mono border border-slate-700 flex items-center gap-1 transition active:scale-95" onclick="copyToClipboard('outputSHA3_256', this)">
            <svg class="w-3 h-3 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span>Copiar</span>
          </button>
        </div>
        <input type="text" id="outputSHA3_256" readonly onkeydown="handleTab(event, 'outputSHA3_224')" class="w-full bg-slate-950/80 border border-slate-800 focus:border-cyan-500 text-cyan-300 font-mono text-xs rounded-lg px-2.5 py-1.5 focus:outline-none transition tracking-tight" />
      </div>

      <!-- 05: SHA3-224 -->
      <div class="bg-darkcard border border-darkborder rounded-xl p-2.5 shadow transition hover:border-slate-700">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-cyan-400">05</span>
            <span class="text-xs font-semibold text-slate-200">SHA3-224</span>
          </div>
          <button class="copy-btn px-2.5 py-0.5 rounded bg-slate-800 hover:bg-cyan-950/60 hover:text-cyan-300 text-slate-300 text-xs font-mono border border-slate-700 flex items-center gap-1 transition active:scale-95" onclick="copyToClipboard('outputSHA3_224', this)">
            <svg class="w-3 h-3 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span>Copiar</span>
          </button>
        </div>
        <input type="text" id="outputSHA3_224" readonly onkeydown="handleTab(event, 'outputSHA256')" class="w-full bg-slate-950/80 border border-slate-800 focus:border-cyan-500 text-cyan-300 font-mono text-xs rounded-lg px-2.5 py-1.5 focus:outline-none transition tracking-tight" />
      </div>

      <!-- 06: SHA-256 -->
      <div class="bg-darkcard border border-darkborder rounded-xl p-2.5 shadow transition hover:border-slate-700">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-cyan-400">06</span>
            <span class="text-xs font-semibold text-slate-200">SHA-256</span>
            <span class="px-1.5 py-0.2 rounded text-[10px] font-medium bg-blue-950/70 text-blue-300 border border-blue-800/60">Padrão</span>
          </div>
          <button class="copy-btn px-2.5 py-0.5 rounded bg-slate-800 hover:bg-cyan-950/60 hover:text-cyan-300 text-slate-300 text-xs font-mono border border-slate-700 flex items-center gap-1 transition active:scale-95" onclick="copyToClipboard('outputSHA256', this)">
            <svg class="w-3 h-3 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span>Copiar</span>
          </button>
        </div>
        <input type="text" id="outputSHA256" readonly onkeydown="handleTab(event, 'input')" class="w-full bg-slate-950/80 border border-slate-800 focus:border-cyan-500 text-cyan-300 font-mono text-xs rounded-lg px-2.5 py-1.5 focus:outline-none transition tracking-tight" />
      </div>

    </div>

    <!-- Rodapé -->
    <footer class="text-center text-[11px] text-slate-500 py-2 flex flex-col sm:flex-row items-center justify-between gap-1 border-t border-slate-900 mt-1">
      <div class="flex items-center gap-2">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-cyan-500"></span>
        <span>SHA3 Keccak & SHA256 Engine</span>
      </div>
      <div>
        Navegação por <kbd class="px-1 py-0.2 bg-slate-800 border border-slate-700 rounded text-cyan-400 font-mono text-[9px]">Tab</kbd> ativa
      </div>
    </footer>
  </div>

  <script>
    function encryptText() {
      const input = document.getElementById("input").value;
      
      document.getElementById("charCount").textContent = `${input.length} caracteres`;

      // Conversão para Binário
      let binaryOutput = '';
      for (let i = 0; i < input.length; i++) {
        binaryOutput += input.charCodeAt(i).toString(2).padStart(8, '0') + (i < input.length - 1 ? ' ' : '');
      }
      document.getElementById("outputBinary").value = binaryOutput;

      // Hashes SHA3
      document.getElementById("outputSHA3_512").value = input ? sha3_512(input) : '';
      document.getElementById("outputSHA3_384").value = input ? sha3_384(input) : '';
      document.getElementById("outputSHA3_256").value = input ? sha3_256(input) : '';
      document.getElementById("outputSHA3_224").value = input ? sha3_224(input) : '';

      // Hash SHA-256
      document.getElementById("outputSHA256").value = input ? sha256(input) : '';
    }

    function handleTab(event, nextElementId) {
      if (event.key === "Tab") {
        event.preventDefault();
        const nextElement = document.getElementById(nextElementId);
        if (nextElement) {
          nextElement.focus();
          nextElement.select();
        }
      }
    }

    function focusFirstInput() {
      document.getElementById("input").focus();
    }

    function clearAll() {
      const inputEl = document.getElementById("input");
      inputEl.value = "";
      encryptText();
      inputEl.focus();
    }

    async function copyToClipboard(elementId, btnElement) {
      const element = document.getElementById(elementId);
      if (!element || !element.value) return;

      element.select();
      
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(element.value);
        } else {
          document.execCommand('copy');
        }

        if (btnElement) {
          const originalContent = btnElement.innerHTML;
          btnElement.innerHTML = `
            <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span class="text-emerald-400 font-semibold text-[11px]">Copiado!</span>
          `;
          btnElement.classList.add("border-emerald-700", "bg-emerald-950/40");

          setTimeout(() => {
            btnElement.innerHTML = originalContent;
            btnElement.classList.remove("border-emerald-700", "bg-emerald-950/40");
          }, 1200);
        }

        element.classList.add("ring-1", "ring-emerald-500/50");
        setTimeout(() => {
          element.classList.remove("ring-1", "ring-emerald-500/50");
        }, 300);

      } catch (err) {
        console.error("Erro ao copiar:", err);
      }
    }
  </script>
</body>
