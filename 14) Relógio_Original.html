<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Analógico de 24 Horas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #121417;
            --bezel-outer: #2c2d30;
            --bezel-inner: #151618;
            --dial-day: #1c222d;
            --dial-night: #0f131a;
            --gold-accent: #c6a052;
            --second-color: #e65100;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1e222a 0%, #0a0b0d 100%);
            font-family: 'Inter', sans-serif;
            color: #fff;
        }

        /* Caixa externa com textura de aço escovado */
        .clock {
            position: relative;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: conic-gradient(
                from 45deg,
                #2f333a, #1a1b1e, #3a3f47, #1a1b1e, 
                #2f333a, #1a1b1e, #3a3f47, #1a1b1e
            );
            padding: 14px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.08),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);
        }

        /* Mostrador interno */
        .dial {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at center, #1b2029 40%, #0d1016 100%);
            box-shadow: 
                inset 0 0 15px rgba(0, 0, 0, 0.8),
                0 0 0 2px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Linha sutil marcando o horizonte do ciclo 24h */
        .dial::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(198, 160, 82, 0.35), transparent);
            z-index: 1;
        }

        .ticks {
            position: absolute;
            inset: 0;
        }

        .tick {
            position: absolute;
            width: 1px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            top: 6px;
            left: 50%;
            transform-origin: 50% 160px;
        }

        .tick.major {
            width: 2px;
            height: 10px;
            background: rgba(198, 160, 82, 0.6);
        }

        .hour-marks {
            position: absolute;
            inset: 0;
            z-index: 2;
        }

        .hour-mark {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
        }

        .hour-mark span {
            display: inline-block;
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.45);
        }

        /* Destaque para horas cardeais */
        .hour-mark.cardinal span {
            top: 20px;
            font-size: 13px;
            font-weight: 700;
            color: var(--gold-accent);
            font-family: 'Cinzel', serif;
        }

        /* Ponteiros com visual náutico/militar refinado */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
        }

        .hand.hour {
            width: 5px;
            height: 85px;
            margin-left: -2.5px;
            background: linear-gradient(to top, #ffffff, #cfd2d6);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            z-index: 4;
        }

        .hand.hour::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 1px;
            width: 3px;
            height: 25px;
            background: var(--gold-accent);
            border-radius: 2px;
        }

        .hand.minute {
            width: 3px;
            height: 120px;
            margin-left: -1.5px;
            background: linear-gradient(to top, #eaeaea, #a5a9b0);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            z-index: 5;
        }

        .hand.second {
            width: 1.5px;
            height: 135px;
            margin-left: -0.75px;
            background: var(--second-color);
            z-index: 6;
        }

        /* Contrapeso do ponteiro de segundos */
        .hand.second::before {
            content: '';
            position: absolute;
            top: 100%;
            left: -1.5px;
            width: 4.5px;
            height: 28px;
            background: var(--second-color);
            border-radius: 2px;
        }

        /* Eixo central com acabamento polido */
        .center-nut {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #f0c370 20%, #443419 80%);
            border: 2px solid #1a1a1a;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 7;
        }

        .digital-box {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 13, 18, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            padding: 3px 8px;
            z-index: 2;
            backdrop-filter: blur(4px);
        }

        .digital {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.7);
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

    <div class="clock">
        <div class="dial">
            <div class="ticks" id="ticks"></div>
            <div class="hour-marks" id="hour-marks"></div>

            <div class="hand hour" id="hour"></div>
            <div class="hand minute" id="minute"></div>
            <div class="hand second" id="second"></div>

            <div class="center-nut"></div>

            <div class="digital-box">
                <div class="digital" id="digital">00:00:00</div>
            </div>
        </div>
    </div>

    <script>
        const hourMarksContainer = document.getElementById('hour-marks');
        const ticksContainer = document.getElementById('ticks');
        const hourHand = document.getElementById('hour');
        const minuteHand = document.getElementById('minute');
        const secondHand = document.getElementById('second');
        const digitalDisplay = document.getElementById('digital');

        // Renderiza traços finos a cada 3.75° (equivalente a 15 min ou marcadores discretos)
        for (let t = 0; t < 96; t++) {
            const tick = document.createElement('div');
            tick.className = `tick ${t % 4 === 0 ? 'major' : ''}`;
            tick.style.transform = `rotate(${t * 3.75}deg)`;
            ticksContainer.appendChild(tick);
        }

        // Renderiza as 24 horas mantendo o número 24 no ápice
        for (let i = 1; i <= 24; i++) {
            const mark = document.createElement('div');
            mark.className = 'hour-mark';
            if (i % 6 === 0) mark.classList.add('cardinal');

            mark.style.transform = `rotate(${i * 15}deg)`;

            const span = document.createElement('span');
            span.textContent = i === 24 ? '24' : String(i).padStart(2, '0');
            span.style.transform = `translateX(-50%) rotate(${-i * 15}deg)`;

            mark.appendChild(span);
            hourMarksContainer.appendChild(mark);
        }

        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const millis = now.getMilliseconds();

            // 1 volta completa = 24 horas (15 graus por hora)
            const hourDeg = (hours * 15) + (minutes * 0.25) + (seconds * (0.25 / 60));
            // 1 volta completa = 60 minutos (6 graus por minuto)
            const minuteDeg = (minutes * 6) + (seconds * 0.1);
            // Movimento suave e contínuo para o ponteiro de segundos
            const secondDeg = (seconds * 6) + (millis * 0.006);

            hourHand.style.transform = `rotate(${hourDeg}deg)`;
            minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
            secondHand.style.transform = `rotate(${secondDeg}deg)`;

            digitalDisplay.textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            requestAnimationFrame(updateClock);
        }

        updateClock();
    </script>
</body>
</html>
