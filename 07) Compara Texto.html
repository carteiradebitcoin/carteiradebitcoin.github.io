<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparador de Textos Offline - Diff Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            darkbg: '#07090e',
            darkcard: '#111726',
            darkborder: '#1e293b',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #07090e;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0d121f;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    /* Estilo de realce de caractere divergente no tema dark */
    .diff {
      color: #fecdd3;
      background-color: rgba(225, 29, 72, 0.45);
      border-bottom: 2px solid #f43f5e;
      font-weight: 700;
      border-radius: 2px;
      padding: 0 1px;
    }
  </style>
</head>
<body onload="initApp()" class="min-h-screen flex flex-col p-3 md:p-5 antialiased selection:bg-cyan-500 selection:text-white">

  <div class="max-w-4xl mx-auto w-full flex-grow flex flex-col gap-3">
    
    <!-- Top Bar: Header & Status -->
    <header class="bg-darkcard border border-darkborder rounded-xl p-3 md:p-4 shadow-lg relative overflow-hidden backdrop-blur-md">
      <div class="absolute -right-16 -top-16 w-52 h-52 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <!-- Título -->
        <div class="flex items-center gap-3">
          <div class="h-8 w-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-md shadow-cyan-500/20">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
            </svg>
          </div>
          <div>
            <h1 class="text-base md:text-lg font-bold tracking-tight text-white flex items-center gap-2">
              DiffCheck <span class="text-cyan-400 font-mono text-[10px] px-1.5 py-0.5 rounded bg-cyan-950/70 border border-cyan-800/50 uppercase">Offline</span>
            </h1>
            <p class="text-[11px] text-slate-400">Comparação caractere a caractere em tempo real</p>
          </div>
        </div>

        <!-- Status & Ações -->
        <div class="flex items-center gap-2">
          <!-- Badge de Status Dinâmico -->
          <div id="statusBadge" class="px-3 py-1 rounded-lg text-xs font-mono font-medium border flex items-center gap-2 transition-all bg-emerald-950/70 text-emerald-400 border-emerald-800">
            <span id="statusDot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span id="statusText">Textos Idênticos</span>
          </div>

          <button onclick="clearAll()" title="Limpar ambos os textos" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition active:scale-95 flex items-center gap-1">
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            Limpar
          </button>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex flex-col gap-2.5">

      <!-- Campo 1: Texto Original -->
      <div class="bg-darkcard border border-darkborder focus-within:border-cyan-500/80 rounded-xl p-3 shadow-md transition">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-cyan-400">01</span>
            <label for="text1" class="text-xs font-semibold text-slate-200">Texto Original</label>
          </div>
          <span id="count1" class="text-[11px] font-mono text-slate-500">0 caracteres</span>
        </div>
        <textarea 
          id="text1" 
          rows="3" 
          placeholder="Cole ou digite o texto original..."
          onkeydown="handleTab(event, 'text2')"
          oninput="compareTexts()" 
          class="w-full bg-slate-900/90 border border-darkborder focus:border-cyan-500 text-slate-100 font-mono text-xs rounded-lg p-2.5 focus:outline-none transition shadow-inner placeholder:text-slate-600 resize-y"
        ></textarea>
      </div>

      <!-- Campo 2: Texto para Comparar -->
      <div class="bg-darkcard border border-darkborder focus-within:border-cyan-500/80 rounded-xl p-3 shadow-md transition">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-cyan-400">02</span>
            <label for="text2" class="text-xs font-semibold text-slate-200">Texto para Comparar</label>
          </div>
          <span id="count2" class="text-[11px] font-mono text-slate-500">0 caracteres</span>
        </div>
        <textarea 
          id="text2" 
          rows="3" 
          placeholder="Cole ou digite o texto que deseja verificar..."
          onkeydown="handleTab(event, 'text1')"
          oninput="compareTexts()" 
          class="w-full bg-slate-900/90 border border-darkborder focus:border-cyan-500 text-slate-100 font-mono text-xs rounded-lg p-2.5 focus:outline-none transition shadow-inner placeholder:text-slate-600 resize-y"
        ></textarea>
      </div>

      <!-- Campo 3: Resultado da Comparação com Highlights -->
      <div class="bg-darkcard border border-darkborder rounded-xl p-3 shadow-md transition">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-amber-400">03</span>
            <span class="text-xs font-semibold text-slate-200">Resultado da Comparação</span>
            <span class="px-1.5 py-0.2 rounded text-[10px] font-mono bg-slate-800 text-slate-400 border border-slate-700">Destaques no Texto 2</span>
          </div>
          <span id="diffStats" class="text-[11px] font-mono text-slate-500">0 divergências</span>
        </div>
        <div 
          id="comparisonDisplay" 
          class="w-full min-h-[75px] max-h-[220px] overflow-y-auto bg-slate-950/80 border border-slate-800 text-slate-200 font-mono text-xs rounded-lg p-2.5 whitespace-pre-wrap break-all tracking-tight"
        ></div>
      </div>

    </main>

    <!-- Rodapé -->
    <footer class="text-center text-[11px] text-slate-500 py-2 flex flex-col sm:flex-row items-center justify-between gap-1 border-t border-slate-900 mt-1">
      <div class="flex items-center gap-2">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-cyan-500"></span>
        <span>Comparador Local Client-Side</span>
      </div>
      <div>
        Alterne entre as caixas usando <kbd class="px-1 py-0.2 bg-slate-800 border border-slate-700 rounded text-cyan-400 font-mono text-[9px]">Tab</kbd>
      </div>
    </footer>
  </div>

  <script>
    function compareTexts() {
      const text1 = document.getElementById('text1').value;
      const text2 = document.getElementById('text2').value;
      
      const display = document.getElementById('comparisonDisplay');
      const statusBadge = document.getElementById('statusBadge');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const diffStats = document.getElementById('diffStats');

      // Atualiza contadores
      document.getElementById('count1').textContent = `${text1.length} caracteres`;
      document.getElementById('count2').textContent = `${text2.length} caracteres`;

      let highlightedHtml = '';
      let diffCount = 0;

      // Comparação caractere por caractere
      for (let i = 0; i < text2.length; i++) {
        const char1 = text1[i];
        const char2 = text2[i];

        // Sanitização de caracteres especiais para exibição segura em HTML
        const safeChar2 = char2
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

        if (char1 === char2) {
          highlightedHtml += safeChar2;
        } else {
          diffCount++;
          highlightedHtml += `<span class="diff">${safeChar2}</span>`;
        }
      }

      // Se text1 for maior que text2, conta a diferença de comprimento
      if (text1.length > text2.length) {
        diffCount += (text1.length - text2.length);
      }

      display.innerHTML = highlightedHtml || '<span class="text-slate-600">Aguardando inserção de dados...</span>';
      diffStats.textContent = `${diffCount} divergência${diffCount === 1 ? '' : 's'}`;

      // Atualização do Status Badge
      if (text1 === text2) {
        statusBadge.className = 'px-3 py-1 rounded-lg text-xs font-mono font-medium border flex items-center gap-2 transition-all bg-emerald-950/70 text-emerald-400 border-emerald-800';
        statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
        statusText.textContent = 'Textos Idênticos';
      } else {
        statusBadge.className = 'px-3 py-1 rounded-lg text-xs font-mono font-medium border flex items-center gap-2 transition-all bg-rose-950/70 text-rose-400 border-rose-800';
        statusDot.className = 'w-2 h-2 rounded-full bg-rose-400 animate-pulse';
        statusText.textContent = 'Textos com Divergência';
      }
    }

    function handleTab(event, nextElementId) {
      if (event.key === "Tab") {
        event.preventDefault();
        const nextElement = document.getElementById(nextElementId);
        if (nextElement) {
          nextElement.focus();
        }
      }
    }

    function clearAll() {
      document.getElementById('text1').value = '';
      document.getElementById('text2').value = '';
      compareTexts();
      document.getElementById('text1').focus();
    }

    function initApp() {
      document.getElementById('text1').focus();
      compareTexts();
    }
  </script>
</body>
</html>
