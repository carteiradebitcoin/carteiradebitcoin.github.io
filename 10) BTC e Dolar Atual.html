<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin Converter Pro - Terminal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #07090e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
    }

    .container {
      width: 100%;
      max-width: 896px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-grow: 1;
    }

    /* Header Principal */
    .header-card {
      background-color: #111726;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.2);
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-tag {
      font-family: Consolas, "JetBrains Mono", "Courier New", monospace;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: rgba(69, 26, 3, 0.7);
      border: 1px solid rgba(180, 83, 9, 0.5);
      color: #fbbf24;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #94a3b8;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-refresh {
      font-family: Consolas, "JetBrains Mono", "Courier New", monospace;
      font-size: 12px;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fcd34d;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-refresh:hover {
      background-color: rgba(245, 158, 11, 0.2);
    }

    .btn-clear {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-clear:hover {
      background-color: #334155;
      color: #ffffff;
    }

    /* Cards de Cotações */
    .quotes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .quote-card {
      background-color: #111726;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .quote-label {
      font-size: 10px;
      font-family: Consolas, "JetBrains Mono", "Courier New", monospace;
      text-transform: uppercase;
      color: #94a3b8;
      display: block;
      margin-bottom: 2px;
    }

    .quote-val {
      font-family: Consolas, "JetBrains Mono", "Courier New", monospace;
      font-size: 13px;
      font-weight: 600;
    }

    .quote-badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-family: Consolas, "JetBrains Mono", "Courier New", monospace;
      border: 1px solid transparent;
    }

    /* Lista de Inputs */
    .inputs-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-card {
      background-color: #111726;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      transition: border-color 0.2s;
    }

    .input-card:hover {
      border-color: #334155;
    }

    .input-card:focus-within {
      border-color: #06b6d4;
    }

    .input-card.focus-usd:focus-within {
      border-color: #10b981;
    }

    .input-card.focus-brl:focus-within {
      border-color: #3b82f6;
    }

    .input-card.focus-btc:focus-within {
      border-color: #06b6d4;
    }

    .input-card.focus-sats:focus-within {
      border-color: #f59e0b;
    }

    .input-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .input-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .num-badge {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background-color: #1e293b;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-family: Consolas, "JetBrains Mono", "Courier New", monospace;
      font-weight: 700;
    }

    .input-title {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .badge-aux {
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-family: Consolas, "JetBrains Mono", "Courier New", monospace;
      border: 1px solid transparent;
    }

    .btn-copy {
      padding: 2px 10px;
      border-radius: 6px;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: 12px;
      font-family: Consolas, "JetBrains Mono", "Courier New", monospace;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-copy:hover {
      background-color: #334155;
      color: #ffffff;
    }

    .field-input {
      width: 100%;
      background-color: rgba(2, 6, 23, 0.8);
      border: 1px solid #1e293b;
      font-family: Consolas, "JetBrains Mono", "Courier New", monospace;
      font-size: 13px;
      border-radius: 8px;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      letter-spacing: -0.01em;
    }

    .field-input:focus {
      border-color: #06b6d4;
    }

    /* Animação do ícone de refresh */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .spin {
      animation: spin 0.8s linear infinite;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0d121f;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Rodapé */
    .footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #0f172a;
      padding-top: 8px;
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
      gap: 6px;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10b981;
    }

    .footer kbd {
      padding: 1px 4px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #fbbf24;
      font-family: Consolas, "JetBrains Mono", "Courier New", monospace;
      font-size: 9px;
    }
  </style>
</head>
<body onload="initApp()">

  <div class="container">
    
    <!-- Header Principal -->
    <header class="header-card">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 14.59h-1.82v-1.1c-.34.07-.7.1-1.07.1-.47 0-.96-.06-1.46-.18l.31-1.28c.4.1.78.16 1.15.16.59 0 .97-.24.97-.68 0-.39-.24-.61-.95-.91-.98-.42-1.57-.96-1.57-1.85 0-.99.76-1.74 2.1-1.88v-1.1h1.82v1.1c.32-.07.64-.1.97-.1.44 0 .86.05 1.25.14l-.3 1.26c-.35-.09-.7-.14-1.05-.14-.54 0-.89.22-.89.62 0 .37.26.57 1.03.88 1.05.42 1.62.99 1.62 1.93 0 1.03-.78 1.77-2.16 1.93v1.11z"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">
            BTC Converter <span class="badge-tag">CoinGecko API</span>
          </h1>
          <p class="brand-subtitle">Conversor bidirecional em tempo real (USD, BRL, BTC e Sats)</p>
        </div>
      </div>

      <!-- Botões de Ação -->
      <div class="header-actions">
        <button id="btnRefresh" onclick="updatePrices()" class="btn-refresh">
          <svg id="refreshIcon" style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>Atualizar</span>
        </button>
        
        <button onclick="clearFields()" title="Limpar todos os campos" class="btn-clear">
          <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          <span>Limpar</span>
        </button>
      </div>
    </header>

    <!-- Cards de Cotações de Topo -->
    <div class="quotes-grid">
      <div class="quote-card">
        <div>
          <span class="quote-label">1 BTC (USD)</span>
          <span id="oneBtcInUsd" class="quote-val" style="color: #34d399;">---</span>
        </div>
        <span class="quote-badge" style="background-color: rgba(6, 78, 59, 0.7); border-color: rgba(16, 185, 129, 0.5); color: #6ee7b7;">USD</span>
      </div>

      <div class="quote-card">
        <div>
          <span class="quote-label">1 BTC (BRL)</span>
          <span id="oneBtcInBrl" class="quote-val" style="color: #38bdf8;">---</span>
        </div>
        <span class="quote-badge" style="background-color: rgba(8, 51, 68, 0.7); border-color: rgba(14, 116, 144, 0.5); color: #67e8f9;">BRL</span>
      </div>

      <div class="quote-card">
        <div>
          <span class="quote-label">Câmbio USD/BRL</span>
          <span id="usdToBrl" class="quote-val" style="color: #cbd5e1;">---</span>
        </div>
        <span class="quote-badge" style="background-color: #1e293b; border-color: #334155; color: #94a3b8;">TAXA</span>
      </div>
    </div>

    <!-- Lista de Inputs (Ordem: Dólar -> Real -> Bitcoin -> Satoshi) -->
    <main class="inputs-list">

      <!-- 01: Dólar (USD) -->
      <div class="input-card focus-usd">
        <div class="input-header">
          <div class="input-meta">
            <span class="num-badge" style="color: #34d399;">01</span>
            <label for="usdValue" class="input-title">Dólar Americano (USD)</label>
          </div>
          <button class="btn-copy" onclick="copyToClipboard('usdValue', this)">
            <svg style="width: 12px; height: 12px; stroke: #34d399; fill: none;" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span>Copiar</span>
          </button>
        </div>
        <input 
          type="text" 
          id="usdValue" 
          placeholder="$ 0.00" 
          onkeydown="handleTab(event, 'brlValue')" 
          class="field-input"
          style="color: #34d399;"
        />
      </div>

      <!-- 02: Real (BRL) -->
      <div class="input-card focus-brl">
        <div class="input-header">
          <div class="input-meta">
            <span class="num-badge" style="color: #60a5fa;">02</span>
            <label for="brlValue" class="input-title">Real Brasileiro (BRL)</label>
          </div>
          <button class="btn-copy" onclick="copyToClipboard('brlValue', this)">
            <svg style="width: 12px; height: 12px; stroke: #60a5fa; fill: none;" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span>Copiar</span>
          </button>
        </div>
        <input 
          type="text" 
          id="brlValue" 
          placeholder="R$ 0,00" 
          onkeydown="handleTab(event, 'btcAmount')" 
          class="field-input"
          style="color: #93c5fd;"
        />
      </div>

      <!-- 03: Bitcoin (BTC) -->
      <div class="input-card focus-btc">
        <div class="input-header">
          <div class="input-meta">
            <span class="num-badge" style="color: #22d3ee;">03</span>
            <label for="btcAmount" class="input-title">Bitcoin (BTC)</label>
          </div>
          <button class="btn-copy" onclick="copyToClipboard('btcAmount', this)">
            <svg style="width: 12px; height: 12px; stroke: #22d3ee; fill: none;" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span>Copiar</span>
          </button>
        </div>
        <input 
          type="text" 
          id="btcAmount" 
          placeholder="0.00000000" 
          onkeydown="handleTab(event, 'satoshiAmount')" 
          class="field-input"
          style="color: #67e8f9;"
        />
      </div>

      <!-- 04: Satoshis (sats) -->
      <div class="input-card focus-sats">
        <div class="input-header">
          <div class="input-meta">
            <span class="num-badge" style="color: #fbbf24;">04</span>
            <label for="satoshiAmount" class="input-title">Satoshis (sats)</label>
            <span class="badge-aux" style="background-color: rgba(69, 26, 3, 0.8); border-color: rgba(180, 83, 9, 0.7); color: #fcd34d;">100M = 1 BTC</span>
          </div>
          <button class="btn-copy" onclick="copyToClipboard('satoshiAmount', this)">
            <svg style="width: 12px; height: 12px; stroke: #fbbf24; fill: none;" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span>Copiar</span>
          </button>
        </div>
        <input 
          type="text" 
          id="satoshiAmount" 
          placeholder="0" 
          onkeydown="handleTab(event, 'usdValue')" 
          class="field-input"
          style="color: #fcd34d;"
        />
      </div>

    </main>

    <!-- Rodapé -->
    <footer class="footer">
      <div class="footer-left">
        <span class="footer-dot"></span>
        <span id="lastUpdated">Pronto para conversão</span>
      </div>
      <div>
        Navegação por <kbd>Tab</kbd> ativa
      </div>
    </footer>
  </div>

  <script>
    let btcPriceInBRL = null;
    let btcPriceInUSD = null;

    async function fetchPrices() {
      try {
        const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=brl,usd');
        if (!response.ok) throw new Error('Falha na resposta da API');
        const data = await response.json();
        return {
          btcInBRL: data.bitcoin.brl,
          btcInUSD: data.bitcoin.usd
        };
      } catch (error) {
        console.error('Erro ao buscar cotações:', error);
        return null;
      }
    }

    async function updatePrices() {
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('spin');

      document.getElementById('oneBtcInBrl').textContent = "Atualizando...";
      document.getElementById('oneBtcInUsd').textContent = "Atualizando...";
      document.getElementById('usdToBrl').textContent = "Atualizando...";

      const prices = await fetchPrices();
      refreshIcon.classList.remove('spin');

      if (prices) {
        btcPriceInBRL = prices.btcInBRL;
        btcPriceInUSD = prices.btcInUSD;
        
        const usdBrlRate = btcPriceInBRL / btcPriceInUSD;

        document.getElementById('oneBtcInBrl').textContent = btcPriceInBRL.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('oneBtcInUsd').textContent = btcPriceInUSD.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
        document.getElementById('usdToBrl').textContent = usdBrlRate.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('lastUpdated').textContent = `Cotação atualizada às ${new Date().toLocaleTimeString()}`;

        const activeInput = document.querySelector('input:focus') || document.getElementById('usdValue');
        if (activeInput && activeInput.value.trim() !== '') {
          updateValues({ target: activeInput, type: 'recalc' });
        }
      } else {
        document.getElementById('oneBtcInBrl').textContent = "Falha";
        document.getElementById('oneBtcInUsd').textContent = "Falha";
        document.getElementById('usdToBrl').textContent = "Falha";
        document.getElementById('lastUpdated').textContent = "Erro de conexão com a API";
      }
    }

    function clearFields() {
      ['usdValue', 'brlValue', 'btcAmount', 'satoshiAmount'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('usdValue').focus();
    }

    function debounce(fn, delay) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), delay);
      };
    }

    function updateValues(event) {
      if (!btcPriceInBRL || !btcPriceInUSD) return;

      const targetId = event.target.id;
      const rawValue = event.target.value;
      if (rawValue === "" && event.type === 'input') {
        clearFields();
        return;
      }

      let satoshis = 0, btcAmount = 0, brlValue = 0, usdValue = 0;

      try {
        if (targetId === 'usdValue') {
          usdValue = parseFloat(rawValue.replace(/[$\s.]/g, '').replace(',', '.')) || 0;
          btcAmount = usdValue / btcPriceInUSD;
          satoshis = Math.round(btcAmount * 100_000_000);
          brlValue = btcAmount * btcPriceInBRL;
        } else if (targetId === 'brlValue') {
          brlValue = parseFloat(rawValue.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
          btcAmount = brlValue / btcPriceInBRL;
          satoshis = Math.round(btcAmount * 100_000_000);
          usdValue = btcAmount * btcPriceInUSD;
        } else if (targetId === 'btcAmount') {
          btcAmount = parseFloat(rawValue.replace(',', '.')) || 0;
          satoshis = Math.round(btcAmount * 100_000_000);
          brlValue = btcAmount * btcPriceInBRL;
          usdValue = btcAmount * btcPriceInUSD;
        } else if (targetId === 'satoshiAmount') {
          satoshis = parseInt(rawValue.replace(/\D/g, '')) || 0;
          btcAmount = satoshis / 100_000_000;
          brlValue = btcAmount * btcPriceInBRL;
          usdValue = btcAmount * btcPriceInUSD;
        }

        if (targetId !== 'usdValue') 
          document.getElementById('usdValue').value = usdValue ? usdValue.toLocaleString('en-US', { style: 'currency', currency: 'USD' }) : '';

        if (targetId !== 'brlValue') 
          document.getElementById('brlValue').value = brlValue ? brlValue.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : '';

        if (targetId !== 'btcAmount') 
          document.getElementById('btcAmount').value = btcAmount ? btcAmount.toFixed(8) : '';

        if (targetId !== 'satoshiAmount') 
          document.getElementById('satoshiAmount').value = satoshis ? satoshis.toLocaleString('pt-BR') : '';

      } catch (error) {
        console.error('Erro no cálculo:', error);
      }
    }

    const debouncedUpdateValues = debounce(updateValues, 300);

    ['usdValue', 'brlValue', 'btcAmount', 'satoshiAmount'].forEach(id => {
      document.getElementById(id).addEventListener('input', debouncedUpdateValues);
    });

    function handleTab(event, nextElementId) {
      if (event.key === "Tab") {
        event.preventDefault();
        const nextElement = document.getElementById(nextElementId);
        if (nextElement) {
          nextElement.focus();
        }
      }
    }

    async function copyToClipboard(elementId, btnElement) {
      const element = document.getElementById(elementId);
      if (!element || !element.value) return;

      element.select();
      
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(element.value);
        } else {
          document.execCommand('copy');
        }

        if (btnElement) {
          const originalContent = btnElement.innerHTML;
          btnElement.innerHTML = `
            <svg style="width: 12px; height: 12px; stroke: #34d399; fill: none;" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span style="color: #34d399; font-weight: 600; font-size: 11px;">Copiado!</span>
          `;
          btnElement.style.borderColor = '#047857';
          btnElement.style.backgroundColor = 'rgba(6, 78, 59, 0.4)';

          setTimeout(() => {
            btnElement.innerHTML = originalContent;
            btnElement.style.borderColor = '';
            btnElement.style.backgroundColor = '';
          }, 1200);
        }

        element.style.borderColor = '#10b981';
        setTimeout(() => {
          element.style.borderColor = '';
        }, 300);

      } catch (err) {
        console.error("Erro ao copiar:", err);
      }
    }

    function initApp() {
      document.getElementById('usdValue').focus();
      updatePrices();
    }
  </script>
</body>
</html>
