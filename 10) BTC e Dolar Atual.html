<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin Converter Pro - Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            darkbg: '#07090e',
            darkcard: '#111726',
            darkborder: '#1e293b',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #07090e;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0d121f;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body onload="initApp()" class="min-h-screen flex flex-col p-3 md:p-5 antialiased selection:bg-amber-500 selection:text-black">

  <div class="max-w-4xl mx-auto w-full flex-grow flex flex-col gap-3">
    
    <!-- Header Principal -->
    <header class="bg-darkcard border border-darkborder rounded-xl p-3 md:p-4 shadow-lg relative overflow-hidden backdrop-blur-md">
      <div class="absolute -right-16 -top-16 w-52 h-52 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center shadow-md shadow-amber-500/20">
            <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 14.59h-1.82v-1.1c-.34.07-.7.1-1.07.1-.47 0-.96-.06-1.46-.18l.31-1.28c.4.1.78.16 1.15.16.59 0 .97-.24.97-.68 0-.39-.24-.61-.95-.91-.98-.42-1.57-.96-1.57-1.85 0-.99.76-1.74 2.1-1.88v-1.1h1.82v1.1c.32-.07.64-.1.97-.1.44 0 .86.05 1.25.14l-.3 1.26c-.35-.09-.7-.14-1.05-.14-.54 0-.89.22-.89.62 0 .37.26.57 1.03.88 1.05.42 1.62.99 1.62 1.93 0 1.03-.78 1.77-2.16 1.93v1.11z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-base md:text-lg font-bold tracking-tight text-white flex items-center gap-2">
              BTC Converter <span class="text-amber-400 font-mono text-[10px] px-1.5 py-0.5 rounded bg-amber-950/70 border border-amber-800/50 uppercase">CoinGecko API</span>
            </h1>
            <p class="text-[11px] text-slate-400">Conversor bidirecional em tempo real (USD, BRL, BTC e Sats)</p>
          </div>
        </div>

        <!-- Botões de Ação -->
        <div class="flex items-center gap-2">
          <button id="btnRefresh" onclick="updatePrices()" class="px-3 py-1.5 rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 text-xs font-mono border border-amber-500/30 transition active:scale-95 flex items-center gap-1.5">
            <svg id="refreshIcon" class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span>Atualizar</span>
          </button>
          
          <button onclick="clearFields()" title="Limpar todos os campos" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition active:scale-95 flex items-center gap-1">
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <span>Limpar</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Cards de Cotações de Topo -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
      <div class="bg-darkcard border border-darkborder rounded-xl p-2.5 flex items-center justify-between shadow-sm">
        <div>
          <span class="text-[10px] font-mono uppercase text-slate-400 block">1 BTC (USD)</span>
          <span id="oneBtcInUsd" class="font-mono text-xs md:text-sm font-semibold text-emerald-400">---</span>
        </div>
        <span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-emerald-950/70 border border-emerald-800/50 text-emerald-300">USD</span>
      </div>

      <div class="bg-darkcard border border-darkborder rounded-xl p-2.5 flex items-center justify-between shadow-sm">
        <div>
          <span class="text-[10px] font-mono uppercase text-slate-400 block">1 BTC (BRL)</span>
          <span id="oneBtcInBrl" class="font-mono text-xs md:text-sm font-semibold text-cyan-400">---</span>
        </div>
        <span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-cyan-950/70 border border-cyan-800/50 text-cyan-300">BRL</span>
      </div>

      <div class="bg-darkcard border border-darkborder rounded-xl p-2.5 flex items-center justify-between shadow-sm">
        <div>
          <span class="text-[10px] font-mono uppercase text-slate-400 block">Câmbio USD/BRL</span>
          <span id="usdToBrl" class="font-mono text-xs md:text-sm font-semibold text-slate-300">---</span>
        </div>
        <span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-slate-800 border border-slate-700 text-slate-400">TAXA</span>
      </div>
    </div>

    <!-- Lista de Inputs (Reordenada: Dólar -> Real -> Bitcoin -> Satoshi) -->
    <main class="flex flex-col gap-2">

      <!-- 01: Dólar (USD) -->
      <div class="bg-darkcard border border-darkborder rounded-xl p-2.5 shadow transition hover:border-slate-700 focus-within:border-emerald-500/80">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-emerald-400">01</span>
            <label for="usdValue" class="text-xs font-semibold text-slate-200">Dólar Americano (USD)</label>
          </div>
          <button class="copy-btn px-2.5 py-0.5 rounded bg-slate-800 hover:bg-emerald-950/60 hover:text-emerald-300 text-slate-300 text-xs font-mono border border-slate-700 flex items-center gap-1 transition active:scale-95" onclick="copyToClipboard('usdValue', this)">
            <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span>Copiar</span>
          </button>
        </div>
        <input 
          type="text" 
          id="usdValue" 
          placeholder="$ 0.00" 
          onkeydown="handleTab(event, 'brlValue')" 
          class="w-full bg-slate-950/80 border border-slate-800 focus:border-emerald-500 text-emerald-400 font-mono text-xs rounded-lg px-2.5 py-1.5 focus:outline-none transition tracking-tight"
        />
      </div>

      <!-- 02: Real (BRL) -->
      <div class="bg-darkcard border border-darkborder rounded-xl p-2.5 shadow transition hover:border-slate-700 focus-within:border-blue-500/80">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-blue-400">02</span>
            <label for="brlValue" class="text-xs font-semibold text-slate-200">Real Brasileiro (BRL)</label>
          </div>
          <button class="copy-btn px-2.5 py-0.5 rounded bg-slate-800 hover:bg-blue-950/60 hover:text-blue-300 text-slate-300 text-xs font-mono border border-slate-700 flex items-center gap-1 transition active:scale-95" onclick="copyToClipboard('brlValue', this)">
            <svg class="w-3 h-3 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span>Copiar</span>
          </button>
        </div>
        <input 
          type="text" 
          id="brlValue" 
          placeholder="R$ 0,00" 
          onkeydown="handleTab(event, 'btcAmount')" 
          class="w-full bg-slate-950/80 border border-slate-800 focus:border-blue-500 text-blue-300 font-mono text-xs rounded-lg px-2.5 py-1.5 focus:outline-none transition tracking-tight"
        />
      </div>

      <!-- 03: Bitcoin (BTC) -->
      <div class="bg-darkcard border border-darkborder rounded-xl p-2.5 shadow transition hover:border-slate-700 focus-within:border-cyan-500/80">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-cyan-400">03</span>
            <label for="btcAmount" class="text-xs font-semibold text-slate-200">Bitcoin (BTC)</label>
          </div>
          <button class="copy-btn px-2.5 py-0.5 rounded bg-slate-800 hover:bg-cyan-950/60 hover:text-cyan-300 text-slate-300 text-xs font-mono border border-slate-700 flex items-center gap-1 transition active:scale-95" onclick="copyToClipboard('btcAmount', this)">
            <svg class="w-3 h-3 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span>Copiar</span>
          </button>
        </div>
        <input 
          type="text" 
          id="btcAmount" 
          placeholder="0.00000000" 
          onkeydown="handleTab(event, 'satoshiAmount')" 
          class="w-full bg-slate-950/80 border border-slate-800 focus:border-cyan-500 text-cyan-300 font-mono text-xs rounded-lg px-2.5 py-1.5 focus:outline-none transition tracking-tight"
        />
      </div>

      <!-- 04: Satoshis (sats) -->
      <div class="bg-darkcard border border-darkborder rounded-xl p-2.5 shadow transition hover:border-slate-700 focus-within:border-amber-500/80">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-mono font-bold text-amber-400">04</span>
            <label for="satoshiAmount" class="text-xs font-semibold text-slate-200">Satoshis (sats)</label>
            <span class="px-1.5 py-0.2 rounded text-[10px] font-mono bg-amber-950/80 text-amber-300 border border-amber-800/70">100M = 1 BTC</span>
          </div>
          <button class="copy-btn px-2.5 py-0.5 rounded bg-slate-800 hover:bg-amber-950/60 hover:text-amber-300 text-slate-300 text-xs font-mono border border-slate-700 flex items-center gap-1 transition active:scale-95" onclick="copyToClipboard('satoshiAmount', this)">
            <svg class="w-3 h-3 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span>Copiar</span>
          </button>
        </div>
        <input 
          type="text" 
          id="satoshiAmount" 
          placeholder="0" 
          onkeydown="handleTab(event, 'usdValue')" 
          class="w-full bg-slate-950/80 border border-slate-800 focus:border-amber-500 text-amber-300 font-mono text-xs rounded-lg px-2.5 py-1.5 focus:outline-none transition tracking-tight"
        />
      </div>

    </main>

    <!-- Rodapé -->
    <footer class="text-center text-[11px] text-slate-500 py-2 flex flex-col sm:flex-row items-center justify-between gap-1 border-t border-slate-900 mt-1">
      <div class="flex items-center gap-2">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="lastUpdated">Pronto para conversão</span>
      </div>
      <div>
        Navegação por <kbd class="px-1 py-0.2 bg-slate-800 border border-slate-700 rounded text-amber-400 font-mono text-[9px]">Tab</kbd> ativa
      </div>
    </footer>
  </div>

  <script>
    let btcPriceInBRL = null;
    let btcPriceInUSD = null;

    async function fetchPrices() {
      try {
        const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=brl,usd');
        if (!response.ok) throw new Error('Falha na resposta da API');
        const data = await response.json();
        return {
          btcInBRL: data.bitcoin.brl,
          btcInUSD: data.bitcoin.usd
        };
      } catch (error) {
        console.error('Erro ao buscar cotações:', error);
        return null;
      }
    }

    async function updatePrices() {
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('animate-spin');

      document.getElementById('oneBtcInBrl').textContent = "Atualizando...";
      document.getElementById('oneBtcInUsd').textContent = "Atualizando...";
      document.getElementById('usdToBrl').textContent = "Atualizando...";

      const prices = await fetchPrices();
      refreshIcon.classList.remove('animate-spin');

      if (prices) {
        btcPriceInBRL = prices.btcInBRL;
        btcPriceInUSD = prices.btcInUSD;
        
        const usdBrlRate = btcPriceInBRL / btcPriceInUSD;

        document.getElementById('oneBtcInBrl').textContent = btcPriceInBRL.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('oneBtcInUsd').textContent = btcPriceInUSD.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
        document.getElementById('usdToBrl').textContent = usdBrlRate.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('lastUpdated').textContent = `Cotação atualizada às ${new Date().toLocaleTimeString()}`;

        const activeInput = document.querySelector('input:focus') || document.getElementById('usdValue');
        if (activeInput && activeInput.value.trim() !== '') {
          updateValues({ target: activeInput, type: 'recalc' });
        }
      } else {
        document.getElementById('oneBtcInBrl').textContent = "Falha";
        document.getElementById('oneBtcInUsd').textContent = "Falha";
        document.getElementById('usdToBrl').textContent = "Falha";
        document.getElementById('lastUpdated').textContent = "Erro de conexão com a API";
      }
    }

    function clearFields() {
      ['usdValue', 'brlValue', 'btcAmount', 'satoshiAmount'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('usdValue').focus();
    }

    function debounce(fn, delay) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), delay);
      };
    }

    function updateValues(event) {
      if (!btcPriceInBRL || !btcPriceInUSD) return;

      const targetId = event.target.id;
      const rawValue = event.target.value;
      if (rawValue === "" && event.type === 'input') {
        clearFields();
        return;
      }

      let satoshis = 0, btcAmount = 0, brlValue = 0, usdValue = 0;

      try {
        if (targetId === 'usdValue') {
          usdValue = parseFloat(rawValue.replace(/[$\s.]/g, '').replace(',', '.')) || 0;
          btcAmount = usdValue / btcPriceInUSD;
          satoshis = Math.round(btcAmount * 100_000_000);
          brlValue = btcAmount * btcPriceInBRL;
        } else if (targetId === 'brlValue') {
          brlValue = parseFloat(rawValue.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
          btcAmount = brlValue / btcPriceInBRL;
          satoshis = Math.round(btcAmount * 100_000_000);
          usdValue = btcAmount * btcPriceInUSD;
        } else if (targetId === 'btcAmount') {
          btcAmount = parseFloat(rawValue.replace(',', '.')) || 0;
          satoshis = Math.round(btcAmount * 100_000_000);
          brlValue = btcAmount * btcPriceInBRL;
          usdValue = btcAmount * btcPriceInUSD;
        } else if (targetId === 'satoshiAmount') {
          satoshis = parseInt(rawValue.replace(/\D/g, '')) || 0;
          btcAmount = satoshis / 100_000_000;
          brlValue = btcAmount * btcPriceInBRL;
          usdValue = btcAmount * btcPriceInUSD;
        }

        if (targetId !== 'usdValue') 
          document.getElementById('usdValue').value = usdValue ? usdValue.toLocaleString('en-US', { style: 'currency', currency: 'USD' }) : '';

        if (targetId !== 'brlValue') 
          document.getElementById('brlValue').value = brlValue ? brlValue.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : '';

        if (targetId !== 'btcAmount') 
          document.getElementById('btcAmount').value = btcAmount ? btcAmount.toFixed(8) : '';

        if (targetId !== 'satoshiAmount') 
          document.getElementById('satoshiAmount').value = satoshis ? satoshis.toLocaleString('pt-BR') : '';

      } catch (error) {
        console.error('Erro no cálculo:', error);
      }
    }

    const debouncedUpdateValues = debounce(updateValues, 300);

    ['usdValue', 'brlValue', 'btcAmount', 'satoshiAmount'].forEach(id => {
      document.getElementById(id).addEventListener('input', debouncedUpdateValues);
    });

    function handleTab(event, nextElementId) {
      if (event.key === "Tab") {
        event.preventDefault();
        const nextElement = document.getElementById(nextElementId);
        if (nextElement) {
          nextElement.focus();
          nextElement.select();
        }
      }
    }

    async function copyToClipboard(elementId, btnElement) {
      const element = document.getElementById(elementId);
      if (!element || !element.value) return;

      element.select();
      
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(element.value);
        } else {
          document.execCommand('copy');
        }

        if (btnElement) {
          const originalContent = btnElement.innerHTML;
          btnElement.innerHTML = `
            <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            <span class="text-emerald-400 font-semibold text-[11px]">Copiado!</span>
          `;
          btnElement.classList.add("border-emerald-700", "bg-emerald-950/40");

          setTimeout(() => {
            btnElement.innerHTML = originalContent;
            btnElement.classList.remove("border-emerald-700", "bg-emerald-950/40");
          }, 1200);
        }

        element.classList.add("ring-1", "ring-emerald-500/50");
        setTimeout(() => {
          element.classList.remove("ring-1", "ring-emerald-500/50");
        }, 300);

      } catch (err) {
        console.error("Erro ao copiar:", err);
      }
    }

    function initApp() {
      document.getElementById('usdValue').focus();
      updatePrices();
    }
  </script>
</body>
</html>
